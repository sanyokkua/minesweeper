name: Deploy Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        env:
            BUILD_TIMESTAMP: ${{ github.run_started_at }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.22.2
                  cache: npm
            - run: npm ci
            - run: npm run validate
            - run: npm run build
            - run: npm run validate:artifact
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist
    deploy:
        needs: build
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
